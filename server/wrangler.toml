name = "fsl-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "fsl"
# Filled in by the deploy workflow (it creates the database on first run).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secret, set by the deploy workflow when present:
#   FCM_SERVICE_ACCOUNT  Firebase service account JSON, used to wake phones when a friend posts.
